name: CI

# pull_request, never pull_request_target: the latter would run a contributor's
# code with access to this repository's secrets.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails rather than silently resolving different versions than the
      # lockfile records. This is what makes committing a lockfile mean something.
      - run: pnpm install --frozen-lockfile

      - name: Format, lint, typecheck, DST boundaries
        run: pnpm verify

      - name: Production build
        env:
          # VITE_ vars are inlined at build time, so the build needs them
          # present or it produces a bundle that throws on every page load.
          # Real values come from the staging deployment once it exists; the
          # placeholders keep this job meaningful before then, since the point
          # of this step is to prove the code compiles and the service worker
          # is emitted, not to reach a live backend.
          VITE_CONVEX_URL: ${{ secrets.STAGING_CONVEX_URL || 'https://placeholder.convex.cloud' }}
          VITE_CONVEX_SITE_URL: ${{ secrets.STAGING_CONVEX_SITE_URL || 'https://placeholder.convex.site' }}
        run: pnpm build

      # src/routeTree.gen.ts is generated by the Start plugin during the build
      # above and committed. If the build rewrote it, the committed copy was
      # stale — a class of breakage that only shows up away from the machine
      # that last ran the dev server.
      - name: Route tree is up to date
        run: git diff --exit-code src/routeTree.gen.ts

  e2e:
    name: e2e
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
    with:
      # The access-control matrix on every run; the full suite on a `run-e2e`
      # label, on demand, or nightly.
      suite: core

  # Without paid branch rules a direct push to main cannot be blocked, so it is
  # made loud instead. This never fails the build — the promote gate above is
  # what actually protects production — it just makes sure an accidental push
  # is noticed rather than discovered later.
  direct-push-tripwire:
    name: pushed via pull request?
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check this commit came from a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          count=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq 'length' 2>/dev/null || echo 0)
          if [ "$count" -gt 0 ]; then
            echo "::notice::Merged from a pull request. "
          else
            echo "::warning::$SHA was pushed straight to main, not merged from a pull request. See CONTRIBUTING.md — main is production."
          fi

  # Production is whatever commit the `production` branch points at, and this
  # job is the only thing that moves it. A commit that lands on main without
  # passing the gates above simply never reaches production — which is the
  # protection branch rules would otherwise provide, without needing them.
  promote:
    name: promote to production
    needs: [verify, e2e]
    # always() so a *skipped* e2e (its Convex deployment not configured yet)
    # does not block releases, while a *failed* one does.
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.verify.result == 'success'
      && needs.e2e.result != 'failure'
      && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: promote-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward production to this commit
        env:
          SHA: ${{ github.sha }}
        run: |
          # Not a force push: if this fails as non-fast-forward, production is
          # ahead of main and that is a real problem to look at, not to override.
          git push origin "$SHA:refs/heads/production"
          echo "::notice::production now points at $SHA"
